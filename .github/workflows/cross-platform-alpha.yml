name: Cross-platform Alpha validation and packages
on:
  push:
    branches: [feat/cross-platform-alpha-release, recovery/continue-alpha-2026-11-01]
  pull_request:
    branches: [feat/alpha-completion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-${{ github.workflow }}-${{ github.sha }}
  # Preserve each commit independently while allowing the latest fix to validate.
  cancel-in-progress: false
jobs:
  test-and-package:
    name: ${{ matrix.platform }} source and extracted package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: ubuntu-x86_64
            python: .venv/bin/python
            qpa: offscreen
            font_dir: ''
          - os: windows-2022
            platform: windows-x64
            python: .venv/Scripts/python.exe
            qpa: offscreen
            font_dir: C:/Windows/Fonts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      STUDIO_GUI_TESTS: '1'
      STUDIO_SCREENSHOT_DIR: validation-screenshots
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      QT_QPA_FONTDIR: ${{ matrix.font_dir }}
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      STUDIO_LGPL_RUNTIME_DIR: build/lgpl-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt host libraries (CI setup only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libnss3 libnspr4 libasound2 libatomic1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxrandr2 libxdamage1 libxcomposite1 libx11-xcb1 libdbus-1-3 libglib2.0-0 libfontconfig1 libfreetype6 libxi6 libxkbfile1 libxss1 libxtst6 libcups2 libpulse0
      - name: Install pinned dependencies and freezer
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra test --python 3.12
          uv pip install --python ${{ matrix.python }} PyInstaller==6.12.0
      - name: Verify Windows headless GUI fonts
        if: runner.os == 'Windows'
        run: >-
          ${{ matrix.python }} -c "from PySide6.QtWidgets import QApplication;
          from PySide6.QtGui import QFont, QFontDatabase, QFontMetrics;
          a=QApplication([]); families=QFontDatabase.families();
          assert 'Segoe UI' in families, 'Windows test font database unavailable';
          assert QFontMetrics(QFont('Segoe UI',10)).inFontUcs4(ord('A')), 'Segoe UI cannot render controls';
          assert QFontMetrics(a.font()).inFontUcs4(ord('A')), 'Default font cannot render Latin controls';
          print('Windows headless GUI fonts verified')"
      - name: Restore verified editor and external Android tools
        run: |
          ${{ matrix.python }} tools/fetch_monaco.py
          ${{ matrix.python }} tools/fetch_adb.py
          ${{ matrix.python }} tools/fetch_scrcpy.py
      - name: Independently rerun original Windows regressions
        id: regressions
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $cases = @(
            'tests/test_alpha_completion_gui.py::test_managed_project_debug_scheduled_simulation_and_restart',
            'tests/test_debugger.py::test_pause_busy_debug_worker_dynamic_breakpoints_and_source_is_frozen',
            'tests/test_device_workbench.py::test_multidevice_video_control_capture_editor_and_disconnect',
            'tests/test_phase6_gui.py::test_real_demo_controls_recognition_recording_and_worker_journey',
            'tests/test_project_management.py::test_archive_rejects_unsafe_portable_paths',
            'tests/test_recovery_engine.py::test_wait_timeout_is_clamped_including_positional_arguments',
            'tests/test_runtime.py::test_other_windows_pipe_errors_still_fail_closed',
            'tests/test_visual_workspaces.py::test_device_manager_visual_library_and_recorder_workflow'
          )
          $failed = $false
          for ($i = 0; $i -lt $cases.Count; $i++) {
            & ${{ matrix.python }} -m pytest -q $cases[$i] "--junitxml=windows-regression-$i.xml"
            $testExit = $LASTEXITCODE
            & ${{ matrix.python }} tools/ci_test_report.py "windows-regression-$i.xml"
            if ($testExit -ne 0 -or $LASTEXITCODE -ne 0) { $failed = $true }
          }
          # Repeat the formerly intermittent managed-project journey separately.
          & ${{ matrix.python }} -m pytest -q $cases[0] "--junitxml=windows-regression-managed-repeat.xml"
          $testExit = $LASTEXITCODE
          & ${{ matrix.python }} tools/ci_test_report.py "windows-regression-managed-repeat.xml"
          if ($testExit -ne 0 -or $LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Full source and actual GUI regression
        id: source
        continue-on-error: true
        run: ${{ matrix.python }} -m pytest -q --junitxml=source-tests.xml
      - name: Publish source test details
        id: report
        continue-on-error: true
        if: always()
        run: ${{ matrix.python }} tools/ci_test_report.py source-tests.xml
      - name: Upload source evidence before native compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-tests-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            source-tests.xml
            windows-regression-*.xml
      - name: Measure actual independent simulation workers
        run: ${{ matrix.python }} tools/benchmark_workers.py --output worker-benchmark.json
      - name: Initialize native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows FFmpeg build shell
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf
      - name: Build LGPL FFmpeg and PyAV from verified sources (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.python }} tools/ci_build.py tools/build_lgpl_runtime.py --output build/lgpl-runtime --bash "${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe"
      - name: Build LGPL FFmpeg and PyAV from verified sources (Ubuntu)
        if: runner.os == 'Linux'
        run: ${{ matrix.python }} tools/ci_build.py tools/build_lgpl_runtime.py --output build/lgpl-runtime
      - name: Install the verified LGPL runtime for packaging
        shell: bash
        run: uv pip install --python ${{ matrix.python }} --reinstall build/lgpl-runtime/wheelhouse/*.whl
      - name: Install Inno Setup compiler (CI build machine only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows archive and smoke extracted executable
        id: windows
        if: runner.os == 'Windows'
        run: ${{ matrix.python }} tools/ci_build.py tools/build_windows.py --installer
      - name: Install, smoke and uninstall per-user Windows package
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: ./tools/verify_installer_windows.ps1
      - name: Build Ubuntu archive and smoke extracted executable
        id: linux
        if: runner.os == 'Linux'
        run: ${{ matrix.python }} tools/ci_build.py tools/build_linux.py
      - name: Verify Ubuntu archive without system Python as unprivileged user
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -f packaging/Dockerfile.ubuntu22-runtime-smoke -t studio-clean-runtime dist
          studio_container=$(docker create studio-clean-runtime)
          trap 'docker rm "$studio_container" >/dev/null' EXIT
          docker cp "$studio_container:/evidence/ubuntu22-clean-runtime-smoke.json" dist/
          docker cp "$studio_container:/evidence/ubuntu22-runtime-info.txt" dist/
      - name: Hold binary publication pending dependency license review
        id: distribution
        continue-on-error: true
        run: ${{ matrix.python }} -c "raise SystemExit('Binary upload blocked pending exact Qt/Chromium/Python notices and FFmpeg distribution review. Source and native package tests may run; no binary release is cleared.')"
      - name: Upload smoke-verified developer applications
        if: success() && steps.source.outcome == 'success' && steps.report.outcome == 'success' && steps.regressions.outcome != 'failure' && steps.distribution.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAutomationStudio-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/AndroidAutomationStudio-windows-x64-portable.zip
            dist/AndroidAutomationStudio-windows-x64-setup.exe
            dist/AndroidAutomationStudio-ubuntu-x86_64.tar.gz
            dist/*.sha256
      - name: Upload source and package validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 30
          path: |
            source-tests.xml
            validation-screenshots/
            windows-regression-*.xml
            dist/*payload-inventory.json
            worker-benchmark.json
            dist/*smoke.json
            dist/*manifest.json
            dist/*validation.json
            dist/*runtime-info.txt
            dist/*.sha256
            build/release-notices/inventory.json
            build/lgpl-runtime/lgpl-runtime.json
      - name: Enforce the source acceptance gate
        if: steps.source.outcome != 'success' || steps.report.outcome != 'success' || steps.regressions.outcome == 'failure'
        run: ${{ matrix.python }} -c "raise SystemExit('Source regression failed; any smoke-verified artifact remains Alpha developer review only. Read the test evidence.')"
      - name: Enforce the binary redistribution gate
        if: steps.distribution.outcome == 'failure'
        run: ${{ matrix.python }} -c "raise SystemExit('Binary redistribution is blocked; inspect dependency license findings. No Windows/Ubuntu binary artifact was uploaded.')"
