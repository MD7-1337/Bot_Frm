[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-automation-studio"
version = "0.2.0"
description = "Android Automation Studio — foundational SikuliX-style Python automation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.3",
    "numpy==2.2.4",
    "opencv-python-headless==4.11.0.86",
    "av==14.2.0",
    "tzdata==2026.6",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
android-automation-studio = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: Qt WebEngine integration requiring desktop or headless setup", "hardware: real authorized Android phone required"]
